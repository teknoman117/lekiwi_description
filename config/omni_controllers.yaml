controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    # Joint State Broadcaster
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Omni Drive Controller
    omni_wheel_drive_controller:
      type: omni_wheel_drive_controller/OmniWheelDriveController

omni_wheel_drive_controller:
  ros__parameters:
    # Wheel configuration
    wheel_names:
      - left_wheel_joint
      - rear_wheel_joint
      - right_wheel_joint

    # Robot geometry (in meters and radians). The Jazzy controller reads only these three; the
    # wheels are evenly spaced, starting at wheel_offset, in wheel_names order.
    # Effective rolling radius, from a measured drive: odometry said 0.584 m for a real 0.56 m
    # with 0.054 (the wheels' 108mm nominal diameter; the URDF keeps that for the model)
    wheel_radius: 0.0518
    wheel_offset: 1.0471975512  # 60 degrees (left); rear at 180, right at -60
    # Effective radius, from a measured spin (with wheel_radius 0.0518): odometry said 1085 deg
    # for a real ~1157 deg with 0.1305, the geometric (108mm + 45mm/2) center to wheel center
    robot_radius: 0.1223

    # No velocity or acceleration limits here: the controller has none. Nav2's
    # velocity_smoother (manipulator/config/nav2_params.yaml) and joy_teleop's scales limit them.

    # Stop the wheels when no command has arrived for this long (seconds). This also covers a
    # crashed teleop or Nav2, but not the servo driver itself (waveshare_servos/docs/operation.md).
    cmd_vel_timeout: 0.5

    # Publishing options
    enable_odom_tf: true
    odom_frame_id: odom
    base_frame_id: base_footprint  # URDF root; base_link already has base_footprint as its parent

    # Odometry configuration
    open_loop: false
    position_feedback: true
    # Covariances for slam_toolbox / Nav2 (x, y, z, roll, pitch, yaw); z and the tilts do not
    # apply to a planar base. Tune from the odometry checks (manipulator/README.md, Navigation).
    diagonal_covariance:
      pose: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.03]
      twist: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.03]
